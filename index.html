<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Efecord</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2230%22 fill=%22%235b8dff%22/><text x=%2250%22 y=%2272%22 font-size=%2262%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Arial%22 font-weight=%22bold%22>E</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Baloo+2:wght@700;800&display=swap">
<style>
:root{--bg:#070a13;--p1:#0e1322;--p2:#151c32;--p3:#1d2644;--line:rgba(255,255,255,.07);--ink:#e9eefc;--mut:#8792b3;--acc:#5b8dff;--acc2:#8a63ff;--ok:#2fd08a;--danger:#ff5a66;--hov:rgba(255,255,255,.055);--sel:rgba(91,141,255,.2)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden;font-size:15px;color-scheme:dark}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea{font:inherit;color:var(--ink);-webkit-text-fill-color:var(--ink);background:var(--p2);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;outline:none;width:100%;caret-color:var(--acc);transition:border-color .15s,box-shadow .15s}
input::placeholder,textarea::placeholder{color:#66719a;-webkit-text-fill-color:#66719a}
input:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(91,141,255,.2)}
input:-webkit-autofill{-webkit-text-fill-color:var(--ink);-webkit-box-shadow:0 0 0 40px var(--p2) inset}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13);border-radius:8px}::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.22)}

@keyframes pop{from{transform:scale(.92);opacity:0}}
@keyframes fadeUp{from{transform:translateY(8px);opacity:0}}
@keyframes slideIn{from{transform:translateY(10px);opacity:0}}
@keyframes shimmer{to{background-position:200% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
@keyframes badge{from{transform:scale(0)}60%{transform:scale(1.25)}}
@keyframes float{50%{transform:translateY(-6px)}}

/* giriş ekranı */
#root{position:relative;height:100%}
.authwrap{position:relative;height:100%;display:grid;place-items:center;padding:20px;overflow:hidden}
.aur{position:absolute;inset:-40%;background:radial-gradient(circle at 30% 35%,rgba(91,141,255,.45),transparent 38%),radial-gradient(circle at 70% 60%,rgba(138,99,255,.4),transparent 36%),radial-gradient(circle at 50% 85%,rgba(47,208,200,.22),transparent 34%);animation:spin 40s linear infinite;will-change:transform}
.auth{position:relative;width:min(420px,100%);background:rgba(14,19,34,.92);border:1px solid var(--line);border-radius:28px;padding:34px 30px;box-shadow:0 30px 80px rgba(0,0,0,.55);animation:pop .35s cubic-bezier(.2,.9,.3,1.2)}
.logo{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:46px;line-height:1;text-align:center;letter-spacing:-1px;background:linear-gradient(90deg,#5b8dff,#b28cff,#37e0d2,#5b8dff);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shimmer 6s linear infinite}
.logo small{display:block;font:600 14px 'Nunito';color:var(--mut);-webkit-text-fill-color:var(--mut);letter-spacing:0;margin-top:8px}
.seg{display:flex;background:var(--p2);border-radius:14px;padding:4px;margin:22px 0 16px}
.seg button{flex:1;padding:9px;border-radius:11px;font-weight:700;color:var(--mut);transition:all .2s}
.seg button.on{background:var(--p3);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.auth input{margin-bottom:10px}
.pwrow{position:relative}.pwrow input{padding-right:44px}
.eye{position:absolute;right:6px;top:5px;width:34px;height:34px;border-radius:10px;font-size:16px;opacity:.8}
.eye:hover{background:var(--hov)}
.btn{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-weight:800;border-radius:13px;padding:11px 18px;box-shadow:0 6px 18px rgba(91,141,255,.3);transition:transform .15s,filter .15s,box-shadow .15s}
.btn:hover{filter:brightness(1.12);transform:translateY(-1px);box-shadow:0 8px 22px rgba(91,141,255,.4)}.btn:active{transform:scale(.96)}
.btn.alt{background:var(--p3);color:var(--ink);box-shadow:none}.btn.alt:hover{background:#26325a}
.btn.danger{background:linear-gradient(135deg,#ff6a74,#e5424f);box-shadow:0 6px 18px rgba(255,90,102,.25)}
.btn.sm{padding:6px 12px;border-radius:10px;font-size:13px}
.btn:disabled{opacity:.6;cursor:wait}
.auth .btn{width:100%;margin-top:4px;padding:13px}
.amsg{min-height:20px;color:var(--danger);font-weight:700;font-size:13px;margin:2px 2px 6px}
.hint{color:var(--mut);font-size:13px;text-align:center;margin-top:12px}

/* uygulama düzeni */
#app{display:flex;height:100%;padding:8px;gap:8px}
.pn1{background:var(--p1);border:1px solid var(--line);border-radius:20px}
#rail{width:70px;flex:none;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 0;overflow-y:auto;scrollbar-width:none}
#rail::-webkit-scrollbar{display:none}
.ri{position:relative;width:48px;height:48px;flex:none;border-radius:50%;background:var(--p3);color:var(--ink);display:grid;place-items:center;font-size:20px;font-weight:800;transition:border-radius .2s,background .2s,transform .2s}
.ri:hover{border-radius:16px;background:#2a3768;transform:translateY(-2px)}
.ri.on{border-radius:16px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.ri:before{content:'';position:absolute;left:-11px;top:50%;width:5px;height:0;border-radius:0 5px 5px 0;background:#fff;transform:translateY(-50%);transition:height .2s}
.ri.on:before{height:26px}.ri:hover:before{height:12px}.ri.on:hover:before{height:26px}
.ri .im{position:absolute;inset:0;border-radius:inherit;overflow:hidden}
.bd{position:absolute;right:-4px;bottom:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--danger);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;border:2px solid var(--p1);animation:badge .3s}
.rsep{width:30px;height:2px;background:var(--line);border-radius:2px;flex:none}
.ri.add{color:var(--ok);font-size:26px;background:var(--p2)}.ri.add:hover{background:var(--ok);color:#06210f}
#side{width:250px;flex:none;display:flex;flex-direction:column;overflow:hidden}
#main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
#main.vin{animation:fadeUp .22s ease-out}
#panel{width:300px;flex:none;overflow-y:auto;animation:pop .22s ease-out}
#panel.hide{display:none}
.sh{padding:16px 16px 10px;font-family:'Baloo 2';font-weight:800;font-size:21px;display:flex;align-items:center;gap:8px;min-height:56px}
.sh .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.sl{flex:1;overflow-y:auto;padding:4px 10px}
.lbl{font-weight:800;font-size:12.5px;color:var(--mut);padding:12px 8px 6px}
.it{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:13px;cursor:pointer;transition:background .15s,transform .15s}
.it:hover{background:var(--hov);transform:translateX(3px)}.it.on{background:var(--sel);font-weight:700}
.it .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .bd{position:static;border:0}
.me{display:flex;align-items:center;gap:10px;padding:10px 12px;margin:8px;border-radius:16px;background:var(--p2)}
.me .who{flex:1;min-width:0;cursor:pointer;line-height:1.2}
.me .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me .who span{font-size:12.5px;color:var(--mut)}
.ib{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:17px;flex:none;transition:background .15s,transform .15s}
.ib:hover{background:var(--hov);transform:scale(1.1)}

.av{position:relative;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex:none;user-select:none}
.av .im{position:absolute;inset:0;border-radius:inherit;overflow:hidden}
.av img,.ri img,.bnr img{display:block;user-select:none;-webkit-user-drag:none}
.dot{position:absolute;right:-1px;bottom:-1px;width:30%;height:30%;min-width:9px;min-height:9px;border-radius:50%;background:#5b6584;border:2.5px solid var(--p1)}
.dot.on{background:var(--ok)}
.sq{border-radius:34%!important}.sq img{border-radius:34%}

.hd{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);min-height:62px;flex:none}
.hd b{font-size:17px;font-weight:800}.hd .sub{color:var(--mut);font-size:13px}
.hd .grow{flex:1;min-width:0}.hd .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.burger{display:none;font-size:20px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:7px 13px;border-radius:11px;font-weight:700;color:var(--mut);transition:background .15s,color .15s}
.tab:hover{background:var(--hov);color:var(--ink)}.tab.on{background:var(--sel);color:#fff}
.tab.go{background:var(--ok);color:#052013}.tab.go.on{background:#26b878}
.body{flex:1;overflow-y:auto;padding:16px 18px}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;cursor:pointer;border-top:1px solid var(--line);transition:background .15s}
.row:first-child{border-top:0}.row:hover{background:var(--hov)}
.row .nm{flex:1;min-width:0}.row .nm small{display:block;color:var(--mut);font-size:12.5px}
.empty{text-align:center;color:var(--mut);padding:50px 20px;line-height:1.6}
.empty .e{font-size:54px;display:block;margin-bottom:6px;animation:float 3s ease-in-out infinite}
.tg{color:var(--mut);font-weight:600;margin-left:1px}
.addbox{display:flex;gap:8px;margin-top:10px}

/* mesajlar */
#msgs{flex:1;overflow-y:auto;padding:14px 18px 6px;overflow-anchor:none}
.start{padding:26px 8px 18px;text-align:center;color:var(--mut)}
.start .e{font-size:44px;display:block;animation:float 3s ease-in-out infinite}
.msg{position:relative;display:flex;gap:12px;padding:2px 8px;border-radius:12px;margin-top:14px;content-visibility:auto;contain-intrinsic-size:auto 56px}
.msg.c{margin-top:0}.msg.in{animation:slideIn .2s ease-out}
.msg:hover{background:var(--hov)}
.msg .l{width:42px;flex:none;display:flex;justify-content:center}
.msg .l .ts{display:none;font-size:11px;color:var(--mut);padding-top:5px}
.msg.c:hover .ts{display:block}
.msg .r{min-width:0;flex:1}
.msg .top{display:flex;align-items:baseline;gap:8px}
.msg .top b{cursor:pointer;font-weight:800}.msg .top b:hover{text-decoration:underline}
.msg .top time{color:var(--mut);font-size:12px}
.txt{white-space:pre-wrap;word-break:break-word;line-height:1.45}
.txt.big{font-size:38px;line-height:1.25}
.txt a{color:#7fa8ff}
.att{display:block;max-width:min(440px,100%);max-height:340px;border-radius:14px;margin-top:6px;background:#000;cursor:pointer}
video.att{cursor:default;width:min(440px,100%)}
.sys{text-align:center;color:var(--mut);font-size:13px;margin:14px 0 4px;font-weight:600}
#typ{height:22px;padding:0 24px;font-size:12.5px;color:var(--mut);font-weight:600;flex:none;display:flex;align-items:center;gap:6px}
.dots{display:inline-flex;gap:3px}.dots i{width:5px;height:5px;border-radius:50%;background:var(--acc);animation:bounce 1.1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
.comp{position:relative;display:flex;align-items:flex-end;gap:6px;margin:0 16px 16px;padding:8px;background:var(--p2);border:1.5px solid var(--line);border-radius:20px;flex:none;transition:border-color .15s,box-shadow .15s}
.comp:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px rgba(91,141,255,.16)}
.comp textarea{border:0;box-shadow:none!important;resize:none;max-height:140px;padding:9px 8px;background:transparent;line-height:1.4}
.comp .ib{font-size:21px;width:40px;height:40px}
.comp .send{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-radius:14px;font-size:17px}
.comp .send:hover{transform:rotate(-12deg) scale(1.08)}
.upl{margin:0 16px 8px;padding:10px 14px;background:var(--p2);border-radius:14px;font-size:13px;font-weight:700;animation:slideIn .2s}
.pbar{height:6px;background:var(--p3);border-radius:6px;margin-top:8px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .15s}
.drop{position:absolute;inset:0;z-index:10;background:rgba(7,10,19,.8);display:none;place-items:center;font-size:22px;font-weight:800;border:3px dashed var(--acc);border-radius:20px;pointer-events:none}
#main.dragging .drop{display:grid}
.emo{position:absolute;right:0;bottom:calc(100% + 10px);width:340px;max-width:calc(100vw - 40px);height:310px;background:var(--p2);border:1px solid var(--line);border-radius:20px;box-shadow:0 14px 44px rgba(0,0,0,.55);display:flex;flex-direction:column;z-index:30;overflow:hidden;animation:pop .15s}
.emo .et{display:flex;border-bottom:1px solid var(--line);padding:6px}
.emo .et button{flex:1;font-size:20px;padding:4px;border-radius:10px}
.emo .et button.on{background:var(--sel)}
.emo .eg{flex:1;overflow-y:auto;padding:8px;display:grid;grid-template-columns:repeat(8,1fr);gap:2px;align-content:start}
.emo .eg button{font-size:23px;padding:4px 0;border-radius:9px;transition:transform .1s,background .1s}
.emo .eg button:hover{background:var(--hov);transform:scale(1.25)}

/* sağ profil paneli */
.bnr{position:relative;overflow:hidden;aspect-ratio:3/1;border-radius:20px 20px 0 0}
#panel .pav{margin:-48px 0 0 16px;width:104px;height:104px;border-radius:50%;background:var(--p1);display:grid;place-items:center}
#panel .pbody{padding:6px 16px 18px}
.pn{font-size:21px;font-weight:800;word-break:break-word}
.ps{color:var(--mut);font-size:13px;margin:2px 0 12px}
.card{background:var(--p2);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.card b{display:block;font-size:12.5px;color:var(--mut);margin-bottom:5px}
.card p{white-space:pre-wrap;word-break:break-word;line-height:1.4}
.cg{display:flex;align-items:center;gap:9px;padding:5px 4px;border-radius:10px;cursor:pointer}.cg:hover{background:var(--hov)}

/* modal */
.ov{position:fixed;inset:0;z-index:50;background:rgba(3,5,12,.65);display:grid;place-items:center;padding:16px;animation:pop .12s}
.modal{width:min(440px,100%);max-height:92vh;overflow:auto;background:var(--p1);border:1px solid var(--line);border-radius:26px;box-shadow:0 24px 70px rgba(0,0,0,.6);animation:pop .2s cubic-bezier(.2,.9,.3,1.2)}
.mh{display:flex;align-items:center;padding:18px 20px 6px}.mh b{flex:1;font-family:'Baloo 2';font-size:22px}
.x{width:32px;height:32px;border-radius:10px;color:var(--mut)}.x:hover{background:var(--hov);color:var(--ink)}
.mb{padding:10px 20px 22px}
.mb h4{margin:14px 0 8px;font-size:13.5px;color:var(--mut)}
.mb input,.mb textarea{margin-bottom:8px}
.mb hr{border:0;border-top:1px solid var(--line);margin:18px 0 4px}
.center{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:8px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.code{display:flex;align-items:center;gap:8px;background:var(--p2);border-radius:12px;padding:8px 12px;font-weight:800;letter-spacing:1px;font-family:ui-monospace,monospace}
.code span{flex:1}
.prof .bnr{margin:-10px -20px 0;border-radius:0}
.prof .pav{margin:-44px 0 0 2px;width:96px;height:96px;border-radius:50%;background:var(--p1);display:grid;place-items:center}
.prof .pb{margin:10px 0 14px;padding:12px;background:var(--p2);border-radius:14px;white-space:pre-wrap;word-break:break-word}
.lb{background:rgba(0,0,0,.88);cursor:zoom-out}.lb img{max-width:92vw;max-height:90vh;border-radius:12px}
#toasts{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--p3);color:var(--ink);padding:11px 18px;border-radius:16px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:fadeUp .25s ease-out}
.toast.err{background:var(--danger);color:#fff}
#conn{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#ffb020;color:#3a2600;font-weight:800;padding:8px 16px;border-radius:14px;z-index:90;display:none}
#conn.on{display:block}

.mdel{display:none;position:absolute;top:4px;right:10px;background:var(--p3);border-radius:10px;padding:3px 8px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.mdel:hover{background:var(--danger)}
.msg:hover .mdel{display:block}
@media(hover:none){.mdel{display:block;opacity:.55}}
.vfail{margin-top:6px;padding:10px 14px;background:var(--p2);border-radius:12px;color:var(--mut);font-size:13px}.vfail a{color:#7fa8ff}
.crp{position:relative;overflow:hidden;border-radius:14px;background:#000;margin:0 auto 14px;cursor:grab;touch-action:none;user-select:none}
.crp:active{cursor:grabbing}
.crp.round:after{content:'';position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 999px rgba(0,0,0,.55);pointer-events:none}
.crp-z{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.crp-z input{padding:0;height:6px;accent-color:var(--acc)}
.upd{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:95;background:linear-gradient(135deg,var(--acc),var(--acc2));padding:9px 12px 9px 16px;border-radius:14px;font-weight:800;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:fadeUp .25s}
@media(max-width:1100px){#panel{display:none}}
@media(max-width:760px){
 #app{padding:6px;gap:6px}
 #rail{width:58px}.ri{width:44px;height:44px}
 #side{display:none}
 body.sideopen #side{display:flex;position:fixed;left:70px;top:6px;bottom:6px;z-index:20;width:min(270px,calc(100vw - 84px));box-shadow:0 20px 60px rgba(0,0,0,.6)}
 .burger{display:block}.txt.big{font-size:32px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>

<body>
<div id="root"></div>
<div id="toasts"></div>
<div id="conn">Bağlantı koptu, yeniden bağlanıyor…</div>

<script>
const WS_URL = 'wss://efeciis.duckdns.org';
const HTTP_BASE = WS_URL.replace(/^ws/, 'http'); // yükleme ve medya adresi (aynı sunucu)
const VER = 4; // server.js'deki CLIENT_VER ile aynı
const mediaUrl = u => !u ? '' : (u.startsWith('/media/') ? HTTP_BASE + u.split('#')[0] : u);
// Kırpma bilgisi adresin sonunda: /media/abc.gif#c=x,y,w,h  (resmin oransal bölgesi). GIF'ler de bozulmadan kırpılır.
function cropImg(u) {
  const [raw, fr] = String(u).split('#');
  const m = /^c=([\d.]+),([\d.]+),([\d.]+),([\d.]+)$/.exec(fr || '');
  const img = h('img', { src: mediaUrl(raw), alt: '', loading: 'lazy', decoding: 'async', draggable: 'false' });
  const c = m ? m.slice(1, 5).map(Number) : null;
  if (c && c[2] > 0.01 && c[3] > 0.01) img.style.cssText = `position:absolute;max-width:none;height:auto;width:${100 / c[2]}%;left:${-c[0] / c[2] * 100}%;top:${-c[1] / c[3] * 100}%`;
  else img.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover';
  return img;
}

// ---------- yardımcılar ----------
const $ = s => document.querySelector(s);
const root = $('#root');
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    e.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return e;
}
function toast(m, kind) {
  const t = h('div', { class: 'toast' + (kind === 'err' ? ' err' : '') }, m);
  $('#toasts').append(t); setTimeout(() => t.remove(), 3600);
}
const fmt = ts => {
  const d = new Date(ts), n = new Date();

const dirty = new Set(); let raf = 0;

function flush() {
  raf = 0; const d = new Set(dirty); dirty.clear();

// ---------- bağlantı ----------
function connect() {
  ws = new WebSocket(WS_URL);
  ws.onopen = () => { $('#conn').classList.remove('on'); if (token) send({ t: 'resume', token }); else showAuth(); };
  ws.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch { return; } handle(m); };
  ws.onclose = () => { $('#conn').classList.add('on'); setTimeout(connect, 2000); };
}
function handle(m) {
  switch (m.t) {
    case 'ready': {
      token = m.token; localStorage.setItem('efecord_token', token);
      if (m.ver && m.ver !== VER && !$('.upd')) document.body.append(h('div', { class: 'upd' }, 'Yeni sürüm var', h('button', { class: 'btn alt sm', onclick: () => location.reload() }, 'Yenile')));
      S.me = m.id; S.friends = m.friends; S.incoming = m.incoming; S.outgoing = m.outgoing;
      S.users = {}; m.users.forEach(u => S.users[u.id] = u);
      S.chats = {}; m.chats.forEach(c => S.chats[c.id] = c);
      if (!$('#app')) buildApp();
      if (S.view.chat && !S.chats[S.view.chat]) S.view = { t: 'home', tab: 'online', chat: null };
      mark('rail', 'side', 'main', 'gs');
      if (S.signedUp) { S.signedUp = false; const u = S.users[S.me]; toast(`Hoş geldin! Arkadaş kodun: ${u.name}#${u.tag}`); }
      break;
    }
    case 'users': {
      let visual = false;
      m.users.forEach(u => {
        const o = S.users[u.id];
        if (o && (o.name !== u.name || o.avatar !== u.avatar || o.color !== u.color)) visual = true;
        S.users[u.id] = u;
      });
      mark('rail', 'side', 'header', 'panel', 'gs', 'home');
      if (visual) mark('msgs', 'fullmsgs', 'keepscroll');
      break;
    }
    case 'friends':
      S.friends = m.friends; S.incoming = m.incoming; S.outgoing = m.outgoing;
      mark('rail', 'side', 'home', 'gs'); break;
    case 'chat': {
      const c = m.chat, old = S.chats[c.id];
      if (c.msgs == null) c.msgs = old ? old.msgs : [];
      S.chats[c.id] = c;
      if (S.pending === c.id) { S.pending = null; go({ t: 'chat', chat: c.id }); }
      else if (!old && S.openNext && c.type === 'group') { S.openNext = false; go({ t: 'chat', chat: c.id }); }
      else mark('rail', 'side', 'header', 'panel', 'gs');
      break;
    }
    case 'chat_removed':
      delete S.chats[m.chat]; delete S.unread[m.chat];
      if (S.view.chat === m.chat) go({ t: 'home', tab: 'online', chat: null }); else mark('rail', 'side', 'gs');
      break;
    case 'msg': {
      const c = S.chats[m.chat]; if (!c) return;
      c.msgs.push(m.msg); if (c.msgs.length > 500) c.msgs.shift();
      if (S.typing[m.chat]) delete S.typing[m.chat][m.msg.a];
      const viewing = S.view.chat === m.chat;
      if (!viewing && m.msg.a !== S.me && !m.msg.sys) S.unread[m.chat] = (S.unread[m.chat] || 0) + 1;
      mark('rail', 'side'); if (viewing) { mark('msgs'); renderTyping(); }
      break;
    }
    case 'msg_del': {
      const c = S.chats[m.chat]; if (!c) return;
      const i = c.msgs.findIndex(x => x.id === m.id); if (i >= 0) c.msgs.splice(i, 1);
      mark('rail', 'side'); if (S.view.chat === m.chat) mark('msgs', 'fullmsgs', 'keepscroll');
      break;
    }
    case 'typing':
      (S.typing[m.chat] = S.typing[m.chat] || {})[m.uid] = Date.now();
      renderTyping(); setTimeout(renderTyping, 3300); break;
    case 'info': toast(m.m); break;
    case 'error': toast(m.m, 'err'); break;
    case 'autherr':
      if (m.resume) { token = null; localStorage.removeItem('efecord_token'); showAuth(); }
      else { const a = $('#amsg'); if (a) a.textContent = m.m; const b = $('#abtn'); if (b) b.disabled = false; }
      break;
  }
}

// ---------- yükleme ----------
function upload(file, onprog) {
  return new Promise((res, rej) => {
    const x = new XMLHttpRequest();
    x.open('POST', HTTP_BASE + '/upload');
    x.setRequestHeader('Authorization', 'Bearer ' + token);
    x.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
    x.upload.onprogress = e => { if (onprog && e.lengthComputable) onprog(e.loaded / e.total); };
    x.onload = () => {
      let j = {}; try { j = JSON.parse(x.responseText); } catch {}
      x.status === 200 ? res(j) : rej(new Error(j.error || 'Yükleme başarısız'));
    };
    x.onerror = () => rej(new Error('Sunucuya ulaşılamadı (nginx boyut sınırını kontrol et)'));
    x.send(file);
  });
}
// Kırpma penceresi: sürükle + yakınlaştır. Sabit resimler kırpılıp küçültülür, GIF/WebP animasyon bozulmasın diye olduğu gibi yüklenip kırpma bölgesi kaydedilir.
function openCropper(file, A, outW, outH, cb) {
  const url = URL.createObjectURL(file);
  const FW = Math.max(180, A >= 2 ? Math.min(420, innerWidth - 90) : Math.min(320, innerWidth - 90)), FH = Math.round(FW / A);
  const frame = h('div', { class: 'crp' + (A === 1 ? ' round' : ''), style: `width:${FW}px;height:${FH}px` });
  const zoom = h('input', { type: 'range', min: 1, max: 4, step: 0.01, value: 1 });
  const img = new Image();
  let ar = 1, z = 1, x = 0, y = 0, ov;
  const dims = () => { const w1 = ar > A ? A / ar : 1, h1 = ar > A ? 1 : ar / A; return { w: w1 / z, h: h1 / z }; };
  const draw = () => {
    const { w, h: hh } = dims();
    x = Math.min(Math.max(x, 0), 1 - w); y = Math.min(Math.max(y, 0), 1 - hh);
    img.style.cssText = `position:absolute;max-width:none;height:auto;pointer-events:none;width:${100 / w}%;left:${-x / w * 100}%;top:${-y / hh * 100}%`;
  };
  const setZoom = v => {
    const o = dims(), cx = x + o.w / 2, cy = y + o.h / 2;
    z = Math.min(4, Math.max(1, v)); zoom.value = z;
    const n = dims(); x = cx - n.w / 2; y = cy - n.h / 2; draw();
  };
  zoom.addEventListener('input', () => setZoom(+zoom.value));
  frame.addEventListener('wheel', e => { e.preventDefault(); setZoom(z + (e.deltaY < 0 ? .12 : -.12)); }, { passive: false });
  let drag = null;
  frame.addEventListener('pointerdown', e => { drag = { px: e.clientX, py: e.clientY }; frame.setPointerCapture(e.pointerId); });
  frame.addEventListener('pointermove', e => {
    if (!drag) return;
    const { w, h: hh } = dims();
    x -= (e.clientX - drag.px) / FW * w; y -= (e.clientY - drag.py) / FH * hh;
    drag = { px: e.clientX, py: e.clientY }; draw();
  });
  const end = () => { drag = null; };
  frame.addEventListener('pointerup', end); frame.addEventListener('pointercancel', end);
  img.onload = () => {
    ar = img.naturalWidth / img.naturalHeight;
    const d = dims(); x = (1 - d.w) / 2; y = (1 - d.h) / 2; draw(); frame.append(img);
  };
  img.onerror = () => { toast('Resim okunamadı', 'err'); if (ov) ov.remove(); };
  const ok = h('button', { class: 'btn' }, 'Kırp ve yükle');
  ok.onclick = async () => {
    ok.disabled = true; ok.textContent = 'Yükleniyor…';
    try {
      const { w, h: hh } = dims(); let blob = file;
      const stat = /^image\/(png|jpeg)$/.test(file.type);
      if (stat) {
        const c = document.createElement('canvas'); c.width = outW; c.height = outH;
        c.getContext('2d').drawImage(img, x * img.naturalWidth, y * img.naturalHeight, w * img.naturalWidth, hh * img.naturalHeight, 0, 0, outW, outH);
        blob = await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('Resim işlenemedi')), file.type, .92));
      }
      const j = await upload(blob);
      cb(stat ? j.url : `${j.url}#c=${[x, y, w, hh].map(n => n.toFixed(4)).join(',')}`);
      URL.revokeObjectURL(url); ov.remove();
    } catch (e) { toast(e.message, 'err'); ok.disabled = false; ok.textContent = 'Kırp ve yükle'; }
  };
  ov = modal(A === 1 ? 'Resmi kırp' : 'Banner’ı kırp', h('div', {},
    frame, h('div', { class: 'crp-z' }, '🔍', zoom),
    h('p', { class: 'hint', style: 'margin:0 0 12px' }, 'Sürükleyerek konumlandır, kaydırıcı veya fare tekeriyle yakınlaştır.'),
    h('div', { class: 'btns' }, ok, h('button', { class: 'btn alt', onclick: () => { URL.revokeObjectURL(url); ov.remove(); } }, 'Vazgeç'))));
  img.src = url;
}
function fileBtn(label, cb, A, outW, outH) {
  const inp = h('input', {
    type: 'file', accept: 'image/*', style: 'display:none',
    onchange: () => {
      const f = inp.files[0]; inp.value = ''; if (!f) return;
      if (!/^image\/(png|jpeg|gif|webp)$/.test(f.type)) return toast('PNG, JPG, GIF veya WebP seç', 'err');
      if (f.size > 8 * 1048576) return toast('En fazla 8 MB olabilir', 'err');
      openCropper(f, A, outW, outH, cb);
    }
  });
  return h('span', {}, inp, h('button', { class: 'btn alt sm', type: 'button', onclick: () => inp.click() }, label));
}
async function sendFile(file) {

  ov = modal('Profil', h('div', { class: 'prof' }, bn, h('div', { class: 'pav' }, av(u, 84, true)),
    h('div', { class: 'pn' }, u.name, h('span', { class: 'tg' }, '#' + u.tag)),
    h('div', { class: 'pb' }, u.bio || 'Henüz bir şey yazmamış.'), h('div', { class: 'btns' }, acts)));
}

function openGroupSettings(id) {
  const body = h('div'); const ov = modal('Grup ayarları', body);
  S.gs = { id, ov, body }; fillGS();
}
function fillGS() {
  if (!S.gs) return;
  const { id, ov, body } = S.gs, c = S.chats[id];
  if (!c || !ov.isConnected) { ov.remove(); S.gs = null; return; }
  const keep = body.querySelector('input.gname'); const typed = keep ? keep.value : c.name;
  body.innerHTML = '';
  const nm = h('input', { class: 'gname', maxlength: 40, placeholder: 'Grup adı' }); nm.value = typed;
  const rename = () => { if (nm.value.trim() && nm.value.trim() !== c.name) send({ t: 'rename_group', chat: id, name: nm.value }); };
  nm.addEventListener('keydown', e => { if (e.key === 'Enter') rename(); });
  body.append(
    h('div', { class: 'center' }, av({ name: c.name, avatar: c.icon, color: '#5b8dff' }, 92, false, true),
      h('div', { class: 'btns' }, fileBtn('🖼️ Resim / GIF', url => send({ t: 'group_icon', chat: id, icon: url }), 1, 512, 512),
        c.icon ? h('button', { class: 'btn alt sm', onclick: () => send({ t: 'group_icon', chat: id, icon: '' }) }, 'Kaldır') : null)),
    h('h4', {}, 'Grup adı'), nm, h('button', { class: 'btn sm', onclick: rename }, 'Adı değiştir'),
    h('h4', {}, 'Davet kodu'),
    h('div', { class: 'code' }, h('span', {}, c.code), h('button', { class: 'btn sm', onclick: () => { navigator.clipboard && navigator.clipboard.writeText(c.code); toast('Kod kopyalandı 🔑'); } }, 'Kopyala')),
    h('h4', {}, `Üyeler — ${c.members.length}`));
  c.members.forEach(mid => {
    const u = S.users[mid];
    body.append(h('div', { class: 'row', onclick: () => showProfile(mid) }, av(u, 36, true),
      h('div', { class: 'nm' }, u ? u.name : '?', c.owner === mid ? ' 👑' : ''),
      c.owner === S.me && mid !== S.me ? h('button', { class: 'btn alt sm', onclick: e => { e.stopPropagation(); if (confirm(`${u ? u.name : ''} gruptan çıkarılsın mı?`)) send({ t: 'kick', chat: id, uid: mid }); } }, 'Çıkar') : null));
  });
  const addable = S.friends.filter(f => !c.members.includes(f) && S.users[f]);
  if (addable.length) {
    body.append(h('h4', {}, 'Arkadaşlarından ekle'));
    addable.forEach(f => body.append(h('div', { class: 'row' }, av(S.users[f], 36, true), h('div', { class: 'nm' }, S.users[f].name),
      h('button', { class: 'btn sm', onclick: () => send({ t: 'add_member', chat: id, uid: f }) }, 'Ekle'))));
  }
  body.append(h('hr'), h('div', { class: 'btns' }, h('button', { class: 'btn danger', onclick: () => { if (confirm('Gruptan ayrılmak istediğine emin misin?')) { send({ t: 'leave_group', chat: id }); ov.remove(); S.gs = null; } } }, 'Gruptan ayrıl')));
}

connect();
</script>
</body>
</html>
